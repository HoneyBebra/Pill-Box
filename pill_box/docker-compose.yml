version: "3.8"

services:
  pill_box:
    container_name: pill_box
    build: .
    restart: always
    image: pill-box
    env_file:
      - .env
    volumes:
      - static_volume:/opt/app/static

  nginx:
    container_name: nginx
    image: nginx:1.25.5
    restart: always
    volumes:
      - ./infra/configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/configs/nginx/site.conf:/etc/nginx/conf.d/site.conf:ro
      - static_volume:/opt/app/static:ro
    ports:
      - "80:80"
    depends_on:
      - pill_box

  postgres:
    container_name: postgres
    image: postgres:18
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - ./infra/volumes/postgresql:/var/lib/postgresql
    restart: always

volumes:
  static_volume:
